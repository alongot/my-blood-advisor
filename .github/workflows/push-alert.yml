name: Push alert
on:
  push:
    branches: ["**"]

jobs:
  slack:
    runs-on: ubuntu-latest
    steps:
      # Values go through env, never inline ${{ }} in the script, so a commit message can't inject shell.
      - env:
          SLACK_PUSH_WEBHOOK: ${{ secrets.SLACK_PUSH_WEBHOOK }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          PUSHER: ${{ github.actor }}
          MESSAGE: ${{ github.event.head_commit.message }}
          URL: ${{ github.event.compare }}
        run: |
          jq -n --arg repo "$REPO" --arg branch "$BRANCH" --arg pusher "$PUSHER" \
                --arg message "${MESSAGE%%$'\n'*}" --arg url "$URL" '{$repo, $branch, $pusher, $message, $url}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' -d @- "$SLACK_PUSH_WEBHOOK"
